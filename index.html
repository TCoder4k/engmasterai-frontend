
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngMasterAI - Học Tiếng Anh Cùng AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Class-based dark mode — the ThemeProvider toggles .dark on <html>.
      //
      // Sprint 06: the `ink` scale is the deep-navy surface palette the
      // Grammar module's dark mode uses. Named here rather than pasted as
      // hex literals across components so the two dozen usages stay one
      // decision. Always used PAIRED with a light class
      // (`bg-white dark:bg-ink-900`) — light mode keeps the slate/white
      // surfaces the rest of the app uses, so the theme toggle stays real.
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              ink: {
                950: '#0B0F19', // page background
                900: '#131B2E', // panel / card
                850: '#1A243B', // hover
                800: '#1E293B', // active / raised
                700: '#1F293D', // border
              },
            },
          },
        },
      };
      // Apply the correct PER-USER theme before first paint so there's no
      // flash and no cross-account leak. Must mirror ThemeProvider's
      // resolveTheme(): admin is always light; otherwise the current user's
      // own scoped preference (engmasterai:theme:<userId>), else system.
      (function () {
        try {
          var uid = 'guest';
          var role = null;
          var raw = localStorage.getItem('user');
          if (raw) {
            try {
              var u = JSON.parse(raw);
              if (u) {
                uid = u.id || 'guest';
                role = u.role || null;
              }
            } catch (e) {}
          }
          var dark;
          if (role === 'ADMIN') {
            dark = false;
          } else {
            var stored = localStorage.getItem('engmasterai:theme:' + uid);
            dark =
              stored === 'dark' ||
              (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/Icon.png">
    <!-- Google Identity Services (Sprint 02A) — loaded async/defer so it
         never blocks first paint. services/googleAuth.ts waits for
         window.google.accounts.id to exist before calling into it; this tag
         only starts the fetch as early as possible. Harmless if
         VITE_GOOGLE_CLIENT_ID is unset — components/auth/GoogleSignInButton
         simply never calls initialize()/renderButton() in that case. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-display {
        font-family: 'Quicksand', sans-serif;
      }
      /* Lesson YouTube embed: the IFrame API replaces our target <div> with
         a bare <iframe> that inherits none of its classes. This static rule
         forces that injected iframe to fill the 16:9 frame the instant it
         exists — no dependency on the player's async onReady, which can lag
         on mobile and otherwise leaves the iframe mispositioned and
         unclickable. Static (not Tailwind-JIT) so it's guaranteed present
         before the iframe is ever created. */
      .yt-player-frame > iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* Practice UI (Sprint 03A+): flip-card helpers for FlashcardSession —
         plain CSS 3D transform, no animation library. */
      .practice-flip-card {
        perspective: 1000px;
      }
      .practice-flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }
      .practice-flip-card-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
      }
      .practice-flip-card-face-back {
        transform: rotateY(180deg);
      }
      /* Sprint 03E fix: the flipped class lives on the SAME element as
         practice-flip-card-inner (see FlashcardSession), so this must be a
         compound selector — the original descendant selector
         (".practice-flip-card-flipped .practice-flip-card-inner") never
         matched anything, which is why cards never flipped. Kept outside
         any media query: the flip STATE must always apply; only the
         transition is motion. */
      .practice-flip-card-inner.practice-flip-card-flipped {
        transform: rotateY(180deg);
      }
      /* Sprint 03G: a soft glow around the Listening completion checkmark.
         The glow itself is always visible; only its gentle pulse is gated
         under reduced-motion below, matching every other animation here. */
      .practice-summary-glow {
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0.12), 0 0 24px 4px rgba(16, 185, 129, 0.25);
      }
      @media (prefers-reduced-motion: no-preference) {
        .practice-flip-card-inner {
          transition: transform 0.4s;
        }
        @keyframes practice-fade-in {
          from { opacity: 0; transform: translateY(4px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .practice-fade-in {
          animation: practice-fade-in 0.2s ease-out;
        }
        /* Celebration burst (Sprint 03E): a short (<800ms) CSS particle
           burst near the answer area — no confetti package, no full-screen
           overlay. Each particle reads its direction from CSS vars set
           inline by CelebrationBurst.tsx. */
        @keyframes practice-burst-particle {
          0% { opacity: 1; transform: translate(0, 0) scale(1); }
          100% { opacity: 0; transform: translate(var(--burst-x), var(--burst-y)) scale(0.4); }
        }
        .practice-burst-particle {
          animation: practice-burst-particle 0.7s ease-out forwards;
        }
        /* Honest indeterminate "speaking" bars for TTS playback (no fake
           duration/progress — TTS has no reliable duration). */
        @keyframes practice-speaking-bar {
          0%, 100% { transform: scaleY(0.35); }
          50% { transform: scaleY(1); }
        }
        .practice-speaking-bar {
          animation: practice-speaking-bar 0.9s ease-in-out infinite;
          transform-origin: center bottom;
        }
        @keyframes practice-summary-glow-pulse {
          0%, 100% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0.10), 0 0 20px 2px rgba(16, 185, 129, 0.20); }
          50% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0.16), 0 0 32px 8px rgba(16, 185, 129, 0.32); }
        }
        .practice-summary-glow {
          animation: practice-summary-glow-pulse 2.2s ease-in-out infinite;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .practice-burst-particle {
          display: none;
        }
      }
    </style>
